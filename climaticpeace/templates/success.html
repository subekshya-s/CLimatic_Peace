<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Application Received — Climatic Peace</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>

:root{
  --navy:#0d3d52;
  --teal:#1f7a8c;
  --gold:#f0b429;
  --text:#4a6272;
  --white:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
  overflow:hidden;
  background:
    radial-gradient(circle at top left, rgba(240,180,41,.15), transparent 35%),
    radial-gradient(circle at bottom right, rgba(31,122,140,.18), transparent 35%),
    linear-gradient(135deg,#0d3d52 0%, #0a2d3d 100%);
}

/* background glow */
.bg-circle{
  position:absolute;
  border-radius:50%;
  filter:blur(20px);
  opacity:.15;
  z-index:0;
}

.bg1{
  width:260px;
  height:260px;
  background:var(--gold);
  top:-80px;
  left:-80px;
}

.bg2{
  width:300px;
  height:300px;
  background:var(--teal);
  bottom:-100px;
  right:-80px;
}

.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:540px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-radius:28px;
  padding:3.5rem 3rem;
  text-align:center;
  box-shadow:
    0 20px 60px rgba(0,0,0,.18),
    0 0 0 1px rgba(255,255,255,.08);
  animation:pop .7s cubic-bezier(.34,1.56,.64,1);
}

@keyframes pop{
  from{
    opacity:0;
    transform:translateY(30px) scale(.9);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* success icon */
.success-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:1.4rem;
}

.success-icon{
  width:95px;
  height:95px;
  border-radius:50%;
  background:rgba(31,122,140,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  animation:pulse 2s infinite;
}

.success-icon::before{
  content:"";
  width:62px;
  height:62px;
  border-radius:50%;
  background:var(--teal);
  position:absolute;
}

.success-icon svg{
  position:relative;
  z-index:2;
  width:34px;
  height:34px;
  stroke:white;
  stroke-width:3;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(31,122,140,.35); }
  70%{ box-shadow:0 0 0 18px rgba(31,122,140,0); }
  100%{ box-shadow:0 0 0 0 rgba(31,122,140,0); }
}

.badge{
  display:inline-block;
  background:rgba(240,180,41,.14);
  color:#9c6b00;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:.55rem .95rem;
  border-radius:999px;
  margin-bottom:1.2rem;
}

h1{
  color:var(--navy);
  font-size:2rem;
  font-weight:800;
  margin-bottom:.9rem;
  line-height:1.2;
}

p{
  color:var(--text);
  font-size:.96rem;
  line-height:1.75;
}

p + p{
  margin-top:.45rem;
}

.highlight{
  color:var(--navy);
  font-weight:700;
}

.back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.5rem;
  margin-top:2rem;
  background:var(--gold);
  color:var(--navy);
  padding:.9rem 2rem;
  border-radius:999px;
  font-weight:700;
  font-size:.92rem;
  text-decoration:none;
  transition:.28s ease;
  box-shadow:0 10px 25px rgba(240,180,41,.25);
}

.back:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 30px rgba(240,180,41,.35);
}

.note{
  margin-top:1.6rem;
  font-size:.8rem;
  color:#7b8d98;
}

@media(max-width:600px){

  body{
    padding:1.2rem;
  }

  .card{
    padding:2.8rem 1.7rem;
    border-radius:24px;
  }

  h1{
    font-size:1.65rem;
  }

  p{
    font-size:.92rem;
  }

  .back{
    width:100%;
  }
}

</style>
</head>

<body>

<div class="bg-circle bg1"></div>
<div class="bg-circle bg2"></div>

<div class="card">

  <div class="success-wrap">
    <div class="success-icon">
      <svg viewBox="0 0 24 24">
        <path d="M5 13l4 4L19 7"></path>
      </svg>
    </div>
  </div>

  <div class="badge">Application Submitted</div>

  <h1>Application Received!</h1>

  <p>
    Thank you for applying to
    <span class="highlight">Youth Are Green Faith Builders 2</span>.
  </p>

  <p>
    Your application has been successfully submitted and is now under review by our team.
  </p>

  <p class="note">
    Selected participants will be contacted through email after the review process.
  </p>

  <a href="{% url 'index' %}" class="back">
    ← Back to Program Page
  </a>

</div>

</body>
</html>
