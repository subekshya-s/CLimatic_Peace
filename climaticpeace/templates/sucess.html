<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Application Received — Climatic Peace</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: #0d3d52;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 3.5rem 3rem;
    max-width: 520px;
    text-align: center;
    animation: pop .6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop {
    from { opacity:0; transform:scale(.85); }
    to   { opacity:1; transform:scale(1); }
  }
  .icon { font-size: 4rem; margin-bottom: 1rem; }
  h1 { color: #0d3d52; font-size: 1.8rem; margin-bottom: .8rem; }
  p  { color: #4a6272; font-size: .92rem; margin-bottom: .4rem; }
  .back {
    display: inline-block;
    margin-top: 1.8rem;
    background: #f0b429;
    color: #0d3d52;
    padding: .75rem 2rem;
    border-radius: 50px;
    font-weight: 700;
    font-size: .92rem;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🌱</div>
    <h1>Application Received!</h1>
    <p>Thank you for applying to <strong>Youth Are Green Faith Builders 2</strong>.</p>
    <p>We've received your application and our team will be in touch soon.</p>
    <a href="{% url 'index' %}" class="back">← Back to Program Page</a>
  </div>
</body>
</html>
